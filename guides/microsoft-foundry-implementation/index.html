      ${note("<strong>Do not mix years or availability dates.</strong> Voice Live API GA belongs to Ignite 2025; Voice Agents lifecycle GA belongs to Ignite 2026. Copilot harness preview originated on 28 October 2026; the Foundry CLI reached GA on 5 November. December announcements below are future commitments, not capabilities available on this guide's 23 November review date.")}`, ["ga","ignite","voice26","devpack26","improvement26"], "Mixed GA / Preview / Retirement");

        ["Work IQ / Fabric IQ tools / 18 Nov","Preview.","Use the downstream user's allowed context; model access does not confer Microsoft 365 or Fabric rights."],

        ["Hosted agents on your AKS / 17-18 Nov","Limited-preview signup; broader public preview targeted early December.","Not a generally available deployment target. Customer owns cluster, networking, registry and capacity."],

        ["Connector Namespace / 17 Nov","GA; custom-image Hosted MCP preview.","Per-user OAuth connections and supported managed identities; namespace VNet integration and richer observability are still roadmap."]

      <div class="actions"><button data-go="browser-connectors">Browser and connector design</button><button data-go="hosted-isolation">Hosted runtime mechanics</button><button data-go="autonomous-identities">Autonomous identities</button></div>`, ["agents26","tools26","browser26","hosted26","aks26","voice26","autonomous26","devpack26","connectors26"], "Ignite 2026 / verified primary sources");

    add("ignite-context", "Start", "Ignite 2026 / context, safety and sovereign AI.", "Microsoft IQ brings together Work IQ, Fabric IQ, Web IQ and Foundry IQ. It does not merge their permissions, billing, data-plane contracts or availability.", `

        ["Agent Controls / 18 Nov","Public preview.","ACS policies return allow/deny/transform decisions and policy-version receipts; verify the runtime actually enforces them."],
        ["Custom guardrail policies / event examples","Private preview.","Deterministic rules plus contextual judges are not automatically enabled for all agents."],
        ["Foundry Compliance / event examples","Policy management public preview; ACS integration private preview.","Azure Policy create/update Deny is distinct from runtime enforcement. Tenant-wide Agent 365 policy integration is preannouncement."],
        ["Foundry Local on Azure Local / 17 Nov","Local inference GA; agent service and guardrails preview.","Customer-operated connected/disconnected deployment with its own catalog, retrieval and operational responsibilities."],

    add("resource-graph", "Foundation", "Draw the resource graph before opening a playground.", "A Foundry resource is an Azure governance boundary; a project is an application-development boundary beneath it. Neither erases the boundaries of connected services.", `
      <div class="boundary"><p class="eyebrow">Subscription / resource group / Foundry account (AIServices)</p>${flow([["Account","Model deployments + network + policies"],["Project","Agents + connections + files + evaluations"],["Agent version","Instructions + model binding + tool definitions"]])}</div>
      ${cards([["Separate resources when the boundary demands it","Use distinct accounts or subscriptions for incompatible networking, residency, administrative control, or environment isolation. Multiple projects can share account-level deployments and governance; do not assume project separation gives independent capacity or network policies."],["Keep connected resources explicit","Search, Storage, Cosmos DB, Key Vault, Application Insights, registry, API gateways, and business systems have independent lifecycles, charges, identities, RBAC, network rules, and retention. Record which are platform-managed versus customer-provided."],["Choose new versus classic deliberately","Foundry projects use the current Cognitive Services account/project model. Classic hub-based resources and older assistants have different contracts. Do not mix hub-specific setup, Threads/Runs payloads, and new Conversations/Responses examples in one recipe."]])}
      ${note("<strong>Evidence to retain:</strong> resolved ARM IDs, tenant/subscription, project endpoint from project details, model deployment identifiers, dependency owners, and a data-flow diagram. An endpoint string is not an ARM scope and a model catalog ID is not a deployment name.")}`, ["architecture","projects","runtime"]);

    add("project-recipe", "Foundation", "Create a usable project, not just an empty container.", "Work from infrastructure and access toward the first verified request. Use the advanced creation path or IaC when organizational policy requires controlled names, regions, tags, or networks.", `
      ${steps([
        "<strong>Fix the design inputs.</strong> Select tenant, subscription, environment, resource group, approved regions, model/agent support, naming, tags, and public-versus-private network topology. Decide account sharing before creation.",
        "<strong>Create or select the Foundry account and project.</strong> In the new portal, use the project picker and Create new project; inspect advanced options. For repeatability, use the documented ARM/Bicep/Terraform route. Record the actual created account and child-project IDs.",
        "<strong>Record identities and grant scoped access.</strong> Distinguish the deployment principal, builder, consumer, project managed identity, and agent identity. Give each only its required data/control actions; role-assignment rights are a separate prerequisite.",
        "<strong>Add the minimum dependencies.</strong> Make one approved model callable, create a narrow nonproduction connection, and choose telemetry. Do not create Search, storage, or a vector database by habit if the selected setup does not require customer-provided instances.",
        "<strong>Prove both positive and negative paths.</strong> Invoke with the intended consumer; deny agent editing for that consumer; test a downstream read from the deployed runtime; verify one trace without sensitive content."
      ])}
      ${note("<strong>Acceptance record:</strong> creation succeeded, identity object IDs are known, endpoints resolve from the intended network, inference and tool calls work under their intended principals, and unauthorized operations are denied. A portal test under an administrator's identity does not satisfy this record.")}`, ["projects","roles","architecture"]);

    add("network-paths", "Foundation", "There are more than two network hops.", "Design caller-to-Foundry ingress, runtime-to-tool egress, Search-to-source access, model calls, telemetry, and image delivery as separate paths.", `
      ${table(["Path","Choose and configure","Prove"],[
        ["Caller to Foundry","Public with appropriate restrictions, or private endpoint with correct private DNS and authorized network access.","Resolve DNS and establish TLS from the actual application host; public access disabled must reject an outside caller."],
        ["Agent to private services","Supported BYO VNet or managed VNet topology, plus dependency endpoints, routes and firewall rules.","Run a deployed tool call, not a ping from an unrelated workstation."],
        ["Search to source / embedding / planner","Search-specific outbound private or supported trusted-service routes; permissions on each target.","Separately verify ingestion, query vectorization, and LLM query planning."],
        ["Hosted runtime / registry / logs","Supported image pull path and instrumentation destination.","Cold start and scale-out successfully; confirm logs arrive under least privilege."]
      ])}
      ${cards([["Plan before provisioning","Some VNet injection choices are create-time constraints. BYO VNet requires dedicated delegation and address planning; prompt agents and hosted sessions consume addresses differently. Size for concurrency, upgrades, and all projects, not just the first agent."],["Check feature eligibility","An available private endpoint is not proof every attached tool, evaluator, trace surface, or memory API supports isolation. Older projects can have different private-registry support. Record region, project creation constraints, tier, and feature compatibility."]])}
      ${note("<strong>Do not solve a private-endpoint timeout by broadening permissions or silently re-enabling public access.</strong> Separate DNS/routing failures from HTTP authentication/authorization. A private endpoint secures ingress; it does not by itself isolate agent egress or change inference processing geography.")}`, ["network","private","iq","ga"]);

    add("sovereign-choice", "Foundation", "Choose who operates the infrastructure.", "Azure-hosted Foundry, Foundry workloads on your AKS, and Foundry Local on Azure Local are separate deployment and operating models.", `
      ${table(["Choice","Platform versus customer responsibility","Implementation gate"],[
        ["Foundry-managed serving and agents","Azure operates the supported runtime; you configure models, identities, policies, dependencies and application recovery.","Confirm feature/region/network compatibility, capacity and the correct project generation."],
        ["Foundry models or hosted agents on your AKS","Preview access paths; you operate cluster upgrades, node/GPU capacity, networking, registry and workload isolation.","Obtain the specific preview, validate runtime/API support and load/recovery behavior. Model deployment and hosted-agent deployment are distinct offers."],
        ["Foundry Local on Azure Local","Local inference GA; local agent service and guardrails preview. Customer controls connected or disconnected infrastructure.","Validate supported hardware/catalog, local ingestion/search/MCP, identity, updates, logs, backup and operation without cloud dependencies."],
        ["Developer-device local inference","A local SDK/model execution scenario, not automatically the same as Azure Local sovereign deployment.","Check device acceleration, model licenses and distribution; do not inherit Azure-hosted service SLAs."]
      ])}
      ${steps(["Write the actual residency and disconnected-operation requirements, including licensing, updates, telemetry and support access.","Inventory every cloud dependency in authentication, retrieval, model calls, tools, evaluations and observability; remove or replace it for a truly disconnected design.","Record the operator for capacity, patches, model artifacts, policy distribution, recovery and incident response. Test loss of the assumed control plane."])}
      ${note("<strong>Local does not mean automatically compliant.</strong> Data access, content safety, model provenance and human approval still need enforceable controls. A cloud private endpoint is not an air gap, and a new preview deployment target is not migration parity.")}`, ["architecture","local26","aks26","hosted26"], "Deployment-model comparison / mixed availability");

    add("principal-map", "Identity", "Name the principal at every hop.", "A managed identity, an Entra agent identity, a human caller, and a connection credential are different security actors.", `
      ${table(["Actor","Responsibility","Common mistake"],[
        ["Deployment principal","Create/configure Azure resources; separately assign roles if authorized.","Assuming Contributor or Owner automatically grants every Foundry data-plane operation."],
        ["Builder / consumer","Builders author/test; consumers invoke allowed agent endpoints.","Giving every end user Foundry User rather than the narrower Foundry Agent Consumer role."],
        ["Project managed identity","Used by integrations explicitly configured for project identity.","Granting it Search access while the connection actually authenticates as an agent identity."],
        ["Agent identity / blueprint","Current agents have their own blueprint and default instance identity; downstream rights start empty.","Treating this identity as the project's managed identity, or assuming inherited legacy grants migrate."],
        ["Search / other service identity","Search accesses sources, embedding and planning models under its configured identity.","Granting only the agent access and overlooking Search's outbound calls."],
        ["End-user delegated authority","Preserve user permissions on supported tool paths.","Using an application-only service token and expecting per-user document authorization automatically."]
      ])}
      ${note("<strong>Hosted code caveat:</strong> the current hosted token service provides the associated agent instance's tokens; the project managed identity is not available to hosted code. A project-identity connection is a platform-managed path, not permission to impersonate that identity from your container.")}`, ["identity","roles","toolauth"]);

    add("permission-matrix", "Identity", "Grant to the actor that actually authenticates.", "Separate resource management, agent invocation, tool execution, and source authorization. A project role does not grant data access to every connected service.", `
      ${table(["Intended operation","Typical assignment / configuration","Validation"],[
        ["Build and test agents","Foundry User at the intended project scope; additional authoring rights where the operation requires them.","Builder can create/invoke; cannot perform unrelated account management."],
        ["Invoke only","Foundry Agent Consumer at supported project or agent scope; use the documented assignment surface.","Consumer can invoke the intended endpoint, not modify agents or reach unrelated agents."],
        ["Read Search content with app-only identity","Search Index Data Reader for the chosen connection identity; configure Search for role-based access.","Read succeeds, write fails. User-level trimming needs its own supported authorization flow."],
        ["Create Search objects / ingest content","Search Service Contributor for object management; Search Index Data Contributor for data writes, as needed.","An ingestion identity is not reused as a read-only runtime identity."],
        ["Search calls a model","Assign the Search identity the documented model data-plane role on the model resource for that contract.","Exercise query planning and vectorization separately."],
        ["Read a Blob / Cosmos record","Use Storage data roles or Cosmos-specific data-plane roles as the target requires.","Management-plane Reader is not treated as content access."]
      ])}
      ${steps(["Resolve the real principal object ID and target resource scope; do not confuse client ID with object ID.", "Inspect the connection's authentication mode and audience before changing grants.", "Apply the narrow role/action set, allow for propagation, and test with the deployed identity.", "Remove unnecessary test grants. Keep a negative test for forbidden writes and a second user with less access."])}
      <p class="fine">Role names were renamed from Azure AI to Foundry. Effective actions, assignment scope, endpoint scheme, and service-specific authorization are authoritative; legacy examples may differ.</p>`, ["roles","identity","pipeline"]);

    add("identity-lab", "Identity", "Trace a tool call across two authorization boundaries.", "The agent authenticates to Toolbox. The tool connection independently chooses whose authority reaches the downstream system.", `
      ${flow([["Caller","Endpoint authorization"],["Agent","Platform / Toolbox token"],["Connection","Auth mode + target audience"],["Downstream","RBAC, app roles, ACLs"]])}
      <div class="grid two"><article class="card lab-controls"><label class="field">Connection authentication<select id="auth-mode"><option value="agentic-identity">agentic-identity</option><option value="project-managed-identity">project-managed-identity</option><option value="oauth2">oauth2</option><option value="user-entra-token">user-entra-token</option><option value="custom-keys">custom-keys</option><option value="none">none</option></select></label><label class="check"><input id="caller-context" type="checkbox" checked><span>The runtime preserves the current caller context.</span></label><label class="check"><input id="downstream-grant" type="checkbox"><span>The selected actor has the required downstream permission / consent.</span></label></article><div id="auth-result" class="readout" aria-live="polite"></div></div>
      ${note("<strong>App-only is not delegated.</strong> For supported per-user hosted-tool access, use the hosting integration that forwards the current request context (including the current call ID). Never hardcode or reuse another request's context. Test two users concurrently with different access; a successful HTTP 200 alone is insufficient.")}
      <p class="fine">Concept model only. Authentication modes have target-specific support and consent requirements; this explorer does not mint tokens or validate a real connection.</p>`, ["toolauth","hostedtools","delegate"]);

    add("autonomous-identities", "Identity", "An autonomous colleague needs its own lifecycle.", "The Microsoft 365 agent-account preview is not a shared human account and is not the same as granting a project managed identity Microsoft Graph access.", `
      ${flow([["Blueprint","Approved agent class"],["Instance","Own Entra Agent ID + agent user"],["Resources","Approved mailbox/calendar/files/Teams"],["Oversight","Owner, tenant policy and disable path"]])}
      ${steps([
        "<strong>Approve the blueprint and intended tasks.</strong> Identify sponsor/manager, tenant administrator, permitted population, channels, allowed data and prohibited actions. Blueprint approval alone grants no business-resource permissions.",
        "<strong>Create an approved instance.</strong> Record the distinct agent identity and agent-user/resource identifiers. Check current preview enrollment, licensing, Microsoft 365 Resources for Agents prerequisites and rollout; a standard Foundry agent does not automatically receive a mailbox.",
        "<strong>Grant specific downstream rights.</strong> Distinguish application permissions, resource-specific access and delegated-user operations. An agent's mailbox/calendar workspace is not entitlement to every employee's content.",
        "<strong>Bound autonomous work.</strong> Require exact-action approvals for sensitive actions, durable operation IDs, bounded schedules/retries and auditable initiator/actor attribution. Do not equate autonomous operation with unlimited execution.",
        "<strong>Test lifecycle control.</strong> Revoke one instance, disable a blueprint class, handle a departed sponsor and preserve permitted audit records. Verify that cached credentials and running jobs cannot continue unauthorized work."
      ])}
      ${note("<strong>Availability caveat:</strong> the Ignite summary says preview while the Agent Service post uses future rollout language. Treat tenant eligibility as an explicit gate. The Hermes cookbook is available; its self-hosted-on-Foundry option is coming soon, not a general production contract.")}`, ["identity","autonomous26","agents26","improvement26"], "Microsoft 365 agent resources / preview rollout");

    add("model-serving", "Models", "Choose the serving contract before the model name.", "Provider, deployment mode, model/version, region, processing scope, and inference protocol all affect what the application can do.", `
      ${cards([["Pay per token / provisioned / batch","For supported models, Standard serves variable traffic; PTUs provision model-processing capacity; Batch handles delay-tolerant asynchronous work. Global, Data Zone, and geography scopes describe processing boundaries, not project locations."],["Managed compute","Open/community models run on dedicated accelerator capacity using versioned deployment templates. Model instance count is not GPU count. Accelerator quota is separate from VM-family, TPM/RPM, and PTU quota. Runtime/API compatibility and content-filter integration differ."],["Instant access / provider offers","Instant access is preview and does not require a separate deployment for supported models. Partner and community offers have distinct licensing, metering, regions, API support, and data terms. A unified catalog is not uniform semantics."]])}
      ${steps(["Compare representative task quality and required capabilities: embeddings, reranking, structured output, reasoning, multimodal, tool calling, or realtime audio.", "Confirm the model/version supports the required agent and protocol. A chat-completions endpoint does not guarantee every Responses feature.", "Copy the endpoint and deployment identifier from the actual deployment; use the documented SDK/client for that route.", "Run schema, stream, cancellation, error, and load tests; pin upgrade behavior and a retirement response."])}
      ${note("<strong>Managed compute exception:</strong> current documentation says built-in Azure AI Content Safety filtering is not in that compute path. Add appropriate application-side safety controls where needed; do not infer filtering from a catalog listing.")}`, ["models","deployment","compute"]);

    add("capacity-routing", "Models", "Quota, capacity, routing, and spend are separate controls.", "Sizing starts with prompt shape and concurrency, not a universal token-to-GPU or PTU conversion.", `
      ${table(["Mechanism","Use it for","Boundary"],[
        ["TPM / RPM and service limits","Rate and deployment-limit planning.","Quota does not reserve deployable capacity or remove runtime throttling."],
        ["PTUs","Predictable sustained model throughput for a measured workload.","Size by model/version, input/output ratio, caching, and concurrency; deployed capacity incurs charges."],
        ["Managed compute instances","Dedicated open-model serving.","Instances x accelerators per template determines GPU requirement and hourly footprint."],
        ["Model router","Supported dynamic quality/cost routing.","Validate candidate model set, privacy, output compatibility, trace attribution, and fallback behavior; routing is not your entire DR design."],
        ["Priority / Flex / Batch","Supported request-level latency or asynchronous cost trade-offs.","Check model and deployment eligibility; do not copy turnaround or SLA assumptions between modes."]
      ])}
      ${cards([["Benchmark the distribution","Measure time to first token, p50/p95 completion latency, output length, concurrency, retries, and useful successful tasks. Simulate long histories and tool loops, not just short single-turn prompts."],["Design a compliant fallback","Alternate model or region requires its own approved processing scope, deployment, quota/capacity, tool compatibility, and regression evidence. A Global deployment does not automatically make the stateful application multi-region."]])}`, ["deployment","compute","router","costs"]);

    add("customization", "Models", "Optimize the failing layer.", "Do not fine-tune away a retrieval, authorization, schema, or orchestration bug.", `
      ${table(["Observed gap","First intervention","Evidence required"],[
        ["Missing or stale enterprise facts","Fix source coverage, ingestion, permission-aware retrieval, and citation behavior.","Retrieval recall/relevance and grounded answer quality on current sources."],
        ["Inconsistent style or repeatable task behavior","Improve prompts and examples; consider supported supervised fine-tuning or distillation after a baseline.","Held-out examples, licensing/consent, deduplication and leakage checks."],
        ["Preference / reward-driven behavior","Use supported DPO or reinforcement fine-tuning where model and region allow.","Calibrated preference/reward data, grader robustness and tests against reward hacking."],
        ["Poor instructions / tool descriptions / model choice","Use evaluation-driven prompt or agent optimization.","Separate optimization and holdout sets; inspect changes, per-evaluator regressions, cost and latency."],
        ["Specialized open weights / adapters","Select a compatible managed-compute template and supported adapter path.","Base/version compatibility, license, capacity and serving validation; adapters include preview paths."]
      ])}
      ${note("<strong>Optimization executes behavior.</strong> Optimizer/evaluation runs can invoke tools and modify real resources before you promote any candidate. Point tools and identities at isolated or read-only test systems. Hosted optimization needs an optimizer-ready configuration and supported Responses protocol; prompt optimization currently excludes the Copilot harness.")}
      <p class="fine">Track dataset lineage, model/version, prompt/skill/tool schema, grader model/configuration, training job, deployment, and post-deployment drift as one release record.</p>`, ["tune","optimize","compute"]);

    add("training-recipe", "Models", "Train only after the experiment is reproducible.", "Managed Training supplies supported training methods; Programmed Training gives you Python-level recipe control on serverless GPUs in public preview.", `
      ${steps([
        "<strong>Capture the baseline.</strong> Freeze task slices, model/version, prompt/tools, latency and cost per successful task. First eliminate retrieval, authorization, schema and orchestration defects.",
        "<strong>Build authorized, separated datasets.</strong> Define input/output schemas, license/PII handling, sample provenance and train/validation/holdout splits. Deduplicate correlated customer conversations across splits.",
        "<strong>Choose the training surface.</strong> Use Managed Training for a supported model/method. Use Programmed Training only when custom Python recipes justify owning dependencies, training logic, reward correctness and preview constraints.",
        "<strong>Make a minimal job work.</strong> Validate data access from the training identity, environment/image, GPU availability, checkpoint/artifact destination and failure logs. Track parameters, seeds where meaningful, grader versions and spend.",
        "<strong>Evaluate the artifact, not the training loss.</strong> Compare holdout task success, refusals, safety, tool schemas, latency and serving cost. Reward/label quality needs independent human calibration.",
        "<strong>Deploy a compatible candidate.</strong> Confirm the resulting model/adapter can be served on the target template and accelerator. Canary it behind an explicit version binding and retain the prior deployment for rollback."
      ])}
      ${cards([["Weight updates versus skill updates","Skills change reusable instructions/procedures and resources; model training changes weights or adapters. A skill improvement can be cheaper and easier to roll back, but still needs permission and task validation."],["Provider-specific access","A model announced in Foundry may need limited-preview approval and may support a different training or serving path than the same family in another product. Catalog presence is not training entitlement."]])}`, ["tune","models26","compute26","improvement26"], "Managed Training / Programmed Training preview");

    add("knowledge-components", "Knowledge", "Index, knowledge source, and knowledge base are not synonyms.", "Foundry IQ exposes both direct Search APIs and a higher-level agentic retrieval contract. Choose the simplest level that meets the task.", `
      ${flow([["Source","Documents, tables, collaboration data"],["Ingestion","Extract, chunk, embed, ACL metadata"],["Index / remote source","Searchable data or delegated query"],["Knowledge base","Source selection + retrieval policy"],["Agent","Uses evidence and citations"]])}
      ${cards([["Index","Schema, keys, searchable/filterable fields, vectors, semantic configuration, and freshness belong to the Search layer. An index is not automatically a knowledge base."],["Knowledge source","Connects a knowledge base to an existing index or supported remote/indexed source. Source type controls ingestion, permission synchronization, and query semantics."],["Knowledge base","References sources and retrieval behavior. Can plan/decompose queries where supported and return extractive evidence or synthesized answers with citations and activity metadata. It can be reused by multiple agents."]])}
      ${note("<strong>Choose the right state.</strong> File search/vector stores suit interaction uploads; curated knowledge bases suit organizational evidence; long-term memory suits learned user context. Fabric IQ adds business semantics/analytics; Work IQ adds Microsoft 365 context. They are complementary products, not interchangeable stores.")}`, ["iq","kb","memory","toolbox"]);

    add("knowledge-recipe", "Knowledge", "Build retrieval from the data outward.", "Verify ingestion and retrieval independently before putting an agent in front of the pipeline.", `
      ${steps([
        "<strong>Source contract.</strong> Identify owner, refresh target, delete/revoke propagation, data classification, document IDs, citation fields, ACLs and supported connector behavior. Choose indexed versus remote retrieval per source.",
        "<strong>Search service and schema.</strong> Choose supported tier/region, enable intended identity and RBAC, create fields and vector/semantic configuration. Size replicas/partitions to your service requirements; do not treat a free proof of concept as a production sizing result.",
        "<strong>Ingest and test.</strong> Parse, chunk, enrich and embed where appropriate. Preserve parent/child IDs, source URI, version and access metadata. Inspect representative chunks; verify refresh, deletions and permissions, not just document counts.",
        "<strong>Create source then knowledge base.</strong> Bind an existing index/source, configure retrieval reasoning and output mode, and attach supported planning/embedding deployments only when needed. Pin the Search API/SDK contract.",
        "<strong>Connect the agent.</strong> Create the project connection to the knowledge-base endpoint using the chosen actor; attach the supported retrieval/MCP integration. Keep agent-to-Search identity distinct from Search-to-model/source identities.",
        "<strong>Prove evidence flow.</strong> Run known-answer and no-answer queries directly; inspect source IDs, citations, activity and latency. Then repeat through the deployed agent under users with different permissions."
      ])}
      ${note("<strong>Version trap:</strong> the current knowledge-base guide documents GA <code>2026-10-01</code> behavior; older <code>2026-04-01</code> has narrower minimal/extractive support. Do not migrate a preview definition by changing only its version string. Limits/default properties also differ across contracts.")}`, ["pipeline","kb","acl","iq"]);

    add("retrieval-lab", "Knowledge", "Tune retrieval without losing the permission boundary.", "Query planning, evidence selection, and answer synthesis are separate work. Low latency on a model-free request does not validate the planner's credentials.", `
      ${table(["Choice","Behavior to validate","Failure signal"],[
        ["Minimal retrieval","Direct/model-free extractive path where supported.","Successful retrieval is incorrectly treated as proof the LLM planner is reachable."],
        ["Low / medium reasoning","Supported planning and source selection/decomposition.","Missing planning activity, planner 401/403, token growth, or unnecessary query fan-out."],
        ["Extractive evidence","Return content, references and activity to the caller/agent.","Citation mapping missing, evidence budget truncates crucial constraints."],
        ["Answer synthesis","Knowledge-base LLM forms an answer where supported.","Double synthesis adds latency and drops citations when the outer agent rewrites."],
        ["ACL / source authorization","Query-time user permissions on supported sources.","Service-level read succeeds but restricted documents leak to a different user."]
      ])}
      <div class="grid two"><article class="card lab-controls"><label class="field">Test query path<select id="retrieval-path"><option value="minimal">Minimal / extractive</option><option value="planned">Planned / extractive</option><option value="synthesized">Planned / synthesized</option></select></label><label class="check"><input id="planner-access" type="checkbox"><span>Search identity can call its configured planning model.</span></label><label class="check"><input id="source-auth" type="checkbox"><span>Supported source authorization and current user context are verified.</span></label></article><div class="readout" id="retrieval-result" aria-live="polite"></div></div>
      <p class="fine">Lab outcomes are conceptual, not an actual Search request. A shared Search reader role alone does not establish per-document authorization.</p>`, ["kb","acl","iq"]);

    add("knowledge-graphs", "Knowledge", "Add relationships only when the question needs them.", "The Ignite knowledge-graph preview adds entities and topics to Foundry IQ; it does not replace source provenance, permissions or a measured retrieval baseline.", `
      ${flow([["Source","Documents + permissions"],["Enrichment","Chunks + images + ontology"],["Graph/index","Entities, sourced edges, topics"],["Knowledge base","Plan and retrieve"],["Answer","Evidence + citations"]])}
      ${steps([
        "<strong>Establish a non-graph baseline.</strong> Use the same supported sources, caller identities and question set. Include multi-document relationship questions and broad corpus-summary questions, not just entity lookup.",
        "<strong>Choose the graph representation.</strong> Add a graph configuration and reviewed domain ontology to a supported knowledge source, or bring an existing graph. Version entity types, relationship meanings and source mapping.",
        "<strong>Inspect the enrichment.</strong> Check entity resolution, duplicate names, incorrect edges, contradictory documents and citations. Automatically derived topics/subtopics use existing embeddings; review any proposed ontology before accepting it.",
        "<strong>Select the query contract.</strong> Query the knowledge base in natural language, or use supported GQL for direct graph queries. Graph lookup, planner reasoning and final synthesis remain distinct responsibilities.",
        "<strong>Choose a planner deliberately.</strong> The Microsoft Retriever 1 preview plans retrieval on an existing index without a frontier-model deployment. This is a distinct supported path, not proof that older LLM-planner identity/network prerequisites vanished.",
        "<strong>Prove permissions and improvement.</strong> Test restricted nodes/edges, source revocation/deletion, citation validity and broad-query leakage. Compare task success, query count, freshness and cost with the same holdout."
      ])}
      ${note("<strong>December is not now.</strong> Serverless GA and managed Foundry IQ in new projects were announced for December 2026. Until the target is actually supported, provision and operate the currently documented resource path. Preview Purview label enforcement fails closed on unverifiable policy; configure and test that specific integration.")}`, ["iq26","iq","kb","acl"], "Knowledge graphs / Microsoft Retriever 1 preview");

    add("mcp-contract", "Tools", "MCP is a protocol boundary, not a permission model.", "The server advertises tools and their schemas; the runtime discovers, selects, authorizes, invokes, and handles results.", `
      ${flow([["Connect","Supported remote transport + TLS + auth"],["Discover","tools/list + schema and metadata"],["Select","Allowlist + relevant tool exposure"],["Invoke","tools/call + arguments + identity"],["Handle","Result, error, consent, audit"]])}
      ${cards([["Design the server contract","Use narrow business operations rather than unrestricted database or shell access. Define required fields, types, enums, size limits and structured error semantics. Validate arguments and resource ownership server-side even if the model emits valid JSON."],["Separate the two auth legs","A token to Foundry/Toolbox does not grant access to the MCP server's API. Configure the correct audience and connection auth. Use app-only authority only when the task allows it; supported delegated paths preserve a user and consent boundary."],["Treat results as untrusted input","Do not execute instructions embedded in tool descriptions or data. Bound response size, timeouts, redirects and retries; keep secrets out of descriptions and prompts. Track server owner, contract version, allowed tools and data destination."]])}
      ${note("<strong>Direct MCP versus Toolbox:</strong> direct integration can be appropriate for a small explicit tool set; Toolbox centralizes reuse and connection management. A generic MCP client does not automatically handle Foundry consent, caller context, or approval semantics. Local stdio server behavior is not a remote Agent Service deployment contract.")}`, ["mcp","toolauth","hostedtools"]);

    add("toolbox-recipe", "Tools", "A Toolbox is a versioned dependency.", "Tools, project connections, and the consuming agent are independently versioned or configured. Promote them as a tested compatibility set.", `
      ${steps([
        "<strong>Create connections first.</strong> Record target endpoint, audience, auth mode, owner and required grants/consent. Secrets belong in supported connection storage, not agent code or prompts.",
        "<strong>Create a Toolbox version.</strong> Add the required tool types, connection references, labels and allowed operations. Keep descriptions distinct enough for selection. Skills, A2A, knowledge and other integrations have their own eligibility.",
        "<strong>Test the immutable version.</strong> Discover tools through the version-specific developer endpoint, invoke a read-only operation with the deployed identity, and deliberately test a forbidden operation.",
        "<strong>Integrate the runtime.</strong> With supported hosted frameworks, use the Foundry Toolbox hosting helper to authenticate and preserve per-request caller context. A successful local developer credential is not proof of deployed permissions.",
        "<strong>Promote deliberately.</strong> The consumer endpoint follows default_version; promotion changes behavior for all consumers using it. A version-pinned client behaves differently. Canary consumers and keep a rollback version."
      ])}
      <pre aria-label="Illustrative endpoint shapes; not executable requests">Project host/path: &lt;account&gt;.services.ai.azure.com/api/projects/&lt;project&gt;
Consumer: &lt;project-endpoint&gt;/toolboxes/&lt;name&gt;/mcp?api-version=v1
Test:     &lt;project-endpoint&gt;/toolboxes/&lt;name&gt;/versions/&lt;version&gt;/mcp?api-version=v1
Platform token scope for the hosted Toolbox path: https://ai.azure.com/.default</pre>
      <p>Supported hosting integrations include Python <code>FoundryToolbox</code> and .NET <code>AddFoundryToolboxes</code>. Preserve the current request context, including <code>x-agent-foundry-call-id</code>, through the supported helper. Never cache or reuse one caller's context across concurrent requests; a platform access token alone does not establish delegated user authority.</p>
      ${note("<strong>Discovery is a separate failure domain.</strong> A broken source can make aggregate tool enumeration/readiness fail. Diagnose default version, tool-name allowlists, connection rights, remote availability, consent and response/header limits before debugging model selection.")}`, ["toolbox","hostedtools","toolauth"]);

    add("approval-lab", "Tools", "Approval metadata does not execute an approval workflow.", "For hosted Toolbox consumers, require_approval is runtime-visible policy metadata; the Toolbox endpoint itself does not block tools/call until a human approves.", `
      <div class="grid two"><article class="card lab-controls"><label class="check"><input id="approval-flag" type="checkbox" checked><span>Tool metadata says require_approval: always.</span></label><label class="check"><input id="approval-runtime" type="checkbox"><span>The runtime pauses, presents exact tool arguments, and enforces the decision.</span></label><label class="check"><input id="approval-human" type="checkbox"><span>The human approves this exact proposed action.</span></label><label class="check"><input id="approval-server" type="checkbox"><span>The tool server rechecks authorization, policy and idempotency.</span></label></article><div id="approval-result" class="readout" aria-live="polite"></div></div>
      ${steps(["Enumerate tool metadata and refuse unsupported consequential tools at integration time.", "Capture proposed tool name, arguments, actor, purpose, expiry and a unique operation identifier; obtain approval out of band from model text.", "After approval, execute only that bound proposal. Recheck user access and business constraints on the tool server; handle a timeout after commit without duplicate side effects.", "Audit approval, denial, execution and reconciliation independently. Test bypass attempts at the runtime and API boundaries."])}
      ${note("<strong>Implementation gate:</strong> if the runtime cannot enforce approval, do not expose a consequential operation on the assumption the flag protects it. Use a read/propose-only tool or a separately enforced approval service. Prompt instructions are not enforcement.")}`, ["hostedtools","toolbox"]);

    add("tool-selection", "Tools", "Choose the tool surface that matches the work.", "A tool is an executable capability; a skill packages reusable procedure. Tool discovery does not grant permission to execute it.", `
      ${table(["Family","Use and implementation consideration","Boundary"],[
        ["Functions / OpenAPI / Azure Functions","Structured business APIs; function calling is client-executed, OpenAPI describes remote operations, Azure Functions integration has its own execution contract.","Function calling is not a Toolbox-hosted tool in the current support matrix."],
        ["MCP / A2A","MCP exposes tools; A2A delegates work to another agent with a distinct identity and task lifecycle.","Apply independent authorization, timeouts and cancellation; an agent card is not a trust certificate."],
        ["File search / code interpreter","Managed vector stores for uploads; sandboxed code for supported analytical tasks.","Track file retention, vector-store lifecycle, sandbox limits, generated files and execution charges."],
        ["Web / browser / computer use / images","Web evidence, website automation, desktop operations and media generation are different capabilities.","Preview and direct-versus-Toolbox support differ; isolate credentials and consequential actions."],
        ["Skills / tool search","Version reusable workflow instructions; expose only relevant tools, pin critical ones and test discovery terminology.","Skills are preview. Validate supporting runtime/resources; discovery success does not prove SKILL resource access."],
        ["Foundry Tools / enterprise IQ","Speech, Language, Translator, vision/document/content processing; Work IQ and Fabric IQ for their supported enterprise contexts.","Review separate licensing, regions, delegated auth, endpoint scopes and data processing."]
      ])}
      ${note("<strong>Scale exposure, not authority.</strong> Tool search can reduce context and selection ambiguity for large catalogs. Maintain allowlists and negative tests; do not make the entire enterprise API surface reachable because discovery can hide it.")}`, ["toolbox","scope","mcp"]);

    add("browser-connectors", "Tools", "Prefer a narrow API; isolate UI automation when necessary.", "Browser Automation, computer use, Connector Namespace and Toolbox solve different layers. GA of the core service does not make every private-network or credential feature GA.", `
      ${table(["Surface","Use and configure","Acceptance evidence"],[
        ["Browser Automation","Isolated cloud browser through Azure Playwright Workspaces/MCP. Scope allowed destinations, accounts, actions and session lifetime.","Test untrusted page content, cross-user sessions, destructive-action approval, logout and expired credentials. Live View/Take control and opt-in recording are distinct controls."],
        ["Computer use","Desktop-level interaction with a supported model/tool; not browser API parity.","Constrain host/application access and verify actions rather than trusting screenshots or narrated success."],
        ["Connector Namespace","Separate Azure resource owns connections, operations, triggers and MCP configurations.","Verify connection owner, per-user versus shared auth, access policies and downstream audit identity."],
        ["Per-user connector OAuth","Supported OAuth connector creates/resolves a user's own connection; downstream acts as that user.","Run simultaneous users, consent/revocation and denied-resource tests. Do not swap to a shared connection on failure."],
        ["Custom-image Hosted MCP","Preview managed MCP hosting within the namespace, not a hosted Foundry agent.","Validate image provenance, server health, authentication, scaling, data handling and operational ownership."]
      ])}
      ${note("<strong>Preview and roadmap boundaries:</strong> Browser Automation private networking, proxy, Web Bot Auth/CAPTCHA and secret handling remain preview; reusable profiles are coming soon. The Connector Namespace GA post still lists namespace VNet integration and richer observability as future work. A private function polling a trigger does not prove that the namespace itself has private inbound/outbound connectivity.")}
      <p>Enable browser <code>run-code</code> only for reviewed scenarios. Opt-in recordings go to your storage and need authorized access/retention. Prefer one narrow approved connector/API operation over a broad session that can navigate and mutate many systems.</p>`, ["browser26","tools26","connectors26","toolbox"], "Core GA / sub-feature previews and roadmap");

    add("runtime-choice", "Runtime", "Pick the runtime and protocol independently.", "The saved definition, conversation state, execution protocol, and deployment artifact serve different purposes.", `
      ${table(["Runtime path","You configure / own","Contract to verify"],[
        ["Prompt agent","Instructions, model and attached tools; Foundry executes the loop.","Agent versions, Conversations/Responses, tool support, endpoint authorization."],
        ["Prompt + Copilot harness (preview)","Explicit managed harness selection for supported tools, skills, files and command workflows.","Not the default for every prompt agent. Check safety, egress, skill and optimization support."],
        ["Hosted agent","Your code/framework and dependencies, packaged for managed execution.","Responses, Invocations, or invocations_ws as appropriate; readiness, streaming, session state, cancellation and token service."],
        ["Voice agent","Server-side spoken definition and selected model/voice pipeline.","kind: voice; realtime versus live subtype, session transport and supported controls."],
        ["External / app-hosted agent","Your app hosting and orchestration.","Call model APIs directly where appropriate; external registration adds supported observability/governance, not Foundry hosting."]
      ])}
      ${note("<strong>State is not authorization.</strong> A conversation can hold history across responses, and a hosted session can persist execution state. Bind state access to the correct user/tenant; never trust an arbitrary conversation ID, file ID, or prior model statement as proof of ownership.")}`, ["runtime","hosted","harness","voice"]);

    add("hosted-isolation", "Runtime", "Session isolation, IP allocation and durability are different.", "Ignite's hosted-runtime changes improve concurrency and recovery, but they do not remove quota, policy rollout or application idempotency responsibilities.", `
      ${table(["Mechanism","Current contract","Implementation requirement"],[
        ["Shared subnet IPs / GA","Sessions share IPs while retaining VM-isolated sandboxes.","Do not use IP identity as tenant/user authorization. Size subnet, routes and regional session quota; blog capacity figures are estimates, not guarantees."],
        ["Egress controls / GA core","Policy enforcement happens outside the sandbox; running sessions retain their old policy.","Audit real destinations, then enforce an allowlist; create fresh sessions for policy verification. Transform and secret-backed headers remain preview."],
        ["Private CA trust / preview","Resource-level CA registration through Key Vault; applies to supported paths/new sessions.","Validate chain/hostname/rotation and access. Do not assume remote builds or mutual TLS are covered."],
        ["Long-running resiliency / GA","Opt-in recovery can rerun the handler after failure or redeployment.","Checkpoint progress in durable state and bind side effects to an operation ID. A resumed handler is not exactly-once execution."],
        ["Idle timeout / GA","Per-version configurable 2 minutes to 4 hours; 15-minute default at review.","Release idle compute deliberately; measure reconnection, state restoration and cost. It is not a maximum business-task lifetime."],
        ["Memory snapshots / preview","Configured per agent version; can improve startup.","Keep required state external. Test what survives crash, idle release, snapshot changes, version rollout and regional loss."]
      ])}
      ${steps(["Cold-start a new version under the real agent identity and restricted network; verify image pull, token service, tool access and trace emission.","Interrupt a side-effecting job after commit but before response; recovery must reconcile the operation rather than repeat it.","Change an egress rule, compare existing versus new sessions, and capture the policy/version evidence. A failed policy evaluation must not silently open outbound access."])}
      ${note("<strong>Quota remains real.</strong> The announcement quotes default regional session quotas in the 1,000-2,000 range per subscription/region; inspect your actual quota instead of treating subnet address-sharing estimates as an entitlement. Azure Policy egress governance is preview with region restrictions.")}`, ["hosted26","hosted","guards","network"], "Hosted runtime / GA core with preview extensions");

    add("state-memory", "Runtime", "Store durable context with an explicit lifecycle.", "Conversation history, files, vector stores, agent memory, and business records need separate ownership and retention.", `
      ${cards([["Conversation and runtime state","Decide what is stored, who can retrieve it, how long it lives, and what happens on retry, session expiry, or regional recovery. Stateful APIs do not relieve the application of user/tenant authorization."],["Long-term memory (preview)","Profile, chat-summary, and procedural memories have extraction, consolidation and retrieval behavior. Set supported TTL and deletion/forget behavior; test correction and poisoned-memory cases. Memory is learned context, not an authoritative employee directory."],["Scope and network limits","Low-level memory APIs require explicit scope. Automatic caller scoping is limited to the supported memory search tool path with its user placeholder. VNet integration for memory stores is currently unsupported; do not quietly add memory to an all-private design."]])}
      ${steps(["Classify each state store and define subject identifiers outside model output.", "Enforce scope from the authenticated caller rather than a user-supplied memory key.", "Test access, update, conflict handling and deletion across users and sessions.", "Trace state references with minimal content; verify data erasure and recovery procedures against every dependent store."])}
      ${note("For the service desk: policies live in the knowledge base; the order system remains the record of truth; an optional language preference can live in approved user memory. A remembered approval must never authorize a new business action.")}`, ["memory","runtime","architecture"]);

    add("orchestration", "Runtime", "Triggering, coordinating, and delegating are different jobs.", "Choose one agent, a routine, code orchestration, or agent-to-agent delegation based on control flow and accountability.", `
      ${cards([["Routines: when to run","One trigger invokes one prompt or hosted agent. Timers, recurring schedules and supported events are project-native automation. Agent identity is the default dispatch authority; creator identity is an explicit create-time choice, not arbitrary future-user delegation."],["Framework orchestration: how work connects","Use code/framework orchestration for branching, checkpoints, human approval, parallelism and compensation. Foundry Workflows retire on 1 December 2026; use Microsoft Agent Framework for new development. A routine can invoke an agent that owns its internal graph."],["A2A: delegate a bounded task","Authenticate to another agent and define the task/result contract. Propagate approved context only; bound retries, nested delegation, tool authority and cost. Correlate traces across agents without assuming all runtimes emit equivalent telemetry."]])}
      ${note("<strong>Routines limitations matter:</strong> no CMK support; region exclusions apply. Delivery retries and dispatch timeouts are not the business task's own exactly-once guarantee. Creator dispatch, connector identity and downstream tool identity are separate. A routine does not support the preview AgentBlueprint endpoint scheme.")}
      <p class="fine">For scheduled employee tasks, verify the intended delegated-user support before enabling automation. Design disable/pause, duplicate delivery, missed trigger and creator-offboarding behavior.</p>`, ["routines","workflows","identity","scope"]);

    add("voice-architecture", "Voice", "Voice has two independent design axes.", "Choose who operates the model deployment, then choose native speech-to-speech or a cascaded speech pipeline. Self-deployed model does not mean self-hosted voice orchestration.", `
      ${table(["Axis","Option","Engineering consequence"],[
        ["Model operation","Managed model","Foundry handles the service-managed selection; verify available models, processing terms and region."],
        ["Model operation","Self-deployed model","Reuse a supported Foundry deployment, quota/PTUs or customization; you manage capacity/version lifecycle."],
        ["Speech path","Native speech-to-speech","A compatible realtime model consumes and emits audio; test prosody, interruption, tool support and audio billing."],
        ["Speech path","Cascaded STT -> text model -> TTS","Choose supported text models, including compatible provider/open models; independently tune recognition, model reasoning and synthesized voice."],
        ["Protocol","realtime versus live","kind: voice with realtime covers native and cascaded paths. live selects GPT-Live (preview), with a distinct full-duplex contract."]
      ])}
      ${note("<strong>Do not conflate four products:</strong> a Voice Agent definition, the Voice Live runtime/integration, a realtime model deployment, and a custom hosted real-time agent are not interchangeable. An existing text agent plus a legacy Voice Live integration has a separate migration path.")}
      <div class="grid two"><article class="card lab-controls"><label class="field">Speech path<select id="voice-path"><option value="native">Native speech-to-speech</option><option value="cascade">Cascaded STT / LLM / TTS</option><option value="live">GPT-Live / full duplex (preview)</option></select></label><label class="field">Model management<select id="voice-model"><option value="managed">Service-managed</option><option value="own">Existing supported deployment</option></select></label></article><div id="voice-result" class="readout" aria-live="polite"></div></div>`, ["voiceconfig","voice","live"]);

    add("voice-recipe", "Voice", "Get one spoken turn working before adding tools.", "Make audio format, agent definition, model access, and client transport independently observable.", `
      ${steps([
        "<strong>Confirm prerequisites.</strong> Foundry project, supported subscription/region, authoring/invocation rights, available voice/model configuration, client runtime, and microphone permission for browser tests. Keep service keys out of untrusted clients.",
        "<strong>Create with Voice interaction mode.</strong> Select a stable name; text/voice interaction mode cannot be switched in place. Configure instructions, model_type/model, greeting, audio input/output, transcription, turn detection and storage policy.",
        "<strong>Save an immutable version.</strong> Record the version and selected serving endpoint behavior. Use the feature quickstart's current SDK and WebSocket/session helper rather than copying a text Responses payload into a live socket.",
        "<strong>Connect and exchange audio.</strong> Match codec, channel count and sample rate in both directions. The starter example uses PCM16 mono at 24 kHz, but the negotiated configuration is authoritative. Handle audio deltas, completion, cancellation, errors and disconnect.",
        "<strong>Verify the first turn.</strong> Confirm recognition/transcript, correct language/voice, short grounded replies, first-audio latency, interruptions and silence. End the session before editing portal configuration.",
        "<strong>Add one read-only tool.</strong> Verify exact invocation/result correlation and spoken failure behavior before adding knowledge, writes, telephony, avatar or multi-agent handoff."
      ])}
      ${note("<strong>Session configuration nuance:</strong> the quickstart relies on server-side agent defaults and does not need an initial client session.update. The configuration guide permits supported audio/avatar session overrides. Do not send unsupported overrides or assume every property is mutable mid-call.")}`, ["voice","voiceconfig"]);

    add("voice-turns", "Voice", "Turn-taking is part of the application contract.", "Endpointing, interruptions, audio playback, and business execution advance on different clocks.", `
      ${cards([["Input and endpointing","Silence-based server_vad and supported semantic VAD variants make different trade-offs. Tune activation sensitivity, prefix padding, silence duration and minimum speech. Test long pauses, accents, code-switching, background speakers, music and silence."],["Barge-in and output","Detect caller speech, stop stale playback, and coordinate response cancellation/truncation using the supported protocol. The client must not keep playing obsolete buffered audio. Interruption of speech does not mean a business mutation was cancelled."],["Noise, echo and voice","Select supported noise suppression and echo cancellation for headset/speaker/phone conditions. Match language and voice type; custom/personal voices require their own eligibility and consent. Test numbers, names and identifiers with realistic audio."]])}
      <div class="grid two"><article class="card lab-controls"><label class="field">Silence endpointing budget (ms)<input id="vad-ms" type="range" min="200" max="1500" step="100" value="600"></label><label class="field">Model + tool critical path (ms)<input id="model-ms" type="range" min="100" max="2500" step="100" value="800"></label><p class="fine">Teaching model: first-audio delay = chosen silence + chosen critical path + 250 ms assumed transport/playback. It is not a measured SLA or native/live latency model.</p></article><div id="latency-result" class="readout" aria-live="polite"></div></div>
      ${note("Measure from the user's actual end of speech to audible useful output. Interim responses can acknowledge a slow tool but must not claim completion. Evaluate false interruptions and clipped utterances separately from average latency.")}`, ["voiceconfig","live"]);

    add("voice-tools", "Voice", "A natural voice is not an authenticated user.", "Caller ID, a spoken name, transcription text, and the agent's identity do not establish the employee's authority.", `
      ${table(["Tool type in Voice Agents","Who executes","What to engineer"],[
        ["function","Your client","Receive proposed call over the live session, authorize/validate, execute and return the correlated result. Implement disconnect and duplicate-call handling."],
        ["mcp","Service","Remote endpoint and configured authentication. Verify caller authority, consent and network support independently."],
        ["toolbox","Service","Agent references a Toolbox name and immutable version in the voice definition. Do not assume it follows the unversioned consumer endpoint's default-promotion behavior."],
        ["system","Service","Supported conversation and phone actions such as ending the conversation; transfer/handoff eligibility and preview status vary."]
      ])}
      ${steps(["Authenticate the person through an approved out-of-band or client login path before exposing protected data or mutations.", "Read back only the minimum non-sensitive action summary. Bind approval to exact server-side arguments, actor and operation ID; speech confirmation is a UX event, not a universal identity factor.", "On interruption, disconnect or timeout, reconcile whether the backend committed. Use idempotency and safe retry; never say a change succeeded until the tool confirms it.", "Test how consent requests, errors, parallel calls and late tool results are presented in speech. A voice-only caller may not be able to complete a browser OAuth consent flow."])}
      ${note("<strong>Version distinction:</strong> the voice configuration guide pins Toolbox versions; hosted consumers may follow default_version via an unversioned endpoint. Record both bindings so a central Toolbox promotion does not create false expectations for the voice channel.")}`, ["voiceconfig","toolauth","hostedtools","identity"]);

    add("voice-channels", "Voice", "Transport, channel, and model features have separate readiness.", "Browser speech, phone connectivity, avatars, GPT-Live and custom hosted media protocols solve different integration problems.", `
      ${cards([["Phone and contact workflows","Supported Teams Phone extensibility and Twilio paths bind phone numbers to agents; call-job APIs cover supported outbound operations. SIP, transfers, campaigns and related writes include preview features. Validate provider setup, region, number ownership, webhook/event validation and human fallback."],["GPT-Live and delegation","GPT-Live (preview) listens and speaks concurrently using sub_protocol: live and native event semantics. Inline subagents/handoff and session operations have their own opt-in/support requirements. Do not reuse realtime VAD, audio or tool assumptions without the live-specific reference."],["Avatar and custom media","Supported avatars add visual/audio synchronization and their own settings/constraints. If you require a custom duplex protocol or wrapper that calls another hosted agent, validate invocations_ws and each independently deployed service rather than treating a speech model as a complete application."]])}
      ${steps(["Choose the channel and verify its supported model, protocol, region, auth and feature status matrix.", "Design greeting/disclosure, consent, recording/transcript storage, PII handling, transfer destinations, operating hours and disconnect policy.", "Test inbound/outbound lifecycle, busy/no-answer, human handoff failure, tool latency, call termination and duplicate post-call event delivery.", "Separate audio, transcript, agent/tool and carrier metrics. Reconcile provider charges, model/audio usage and any hosted dependencies."])}
      ${note("<strong>Ignite additions need component-level checks:</strong> Microsoft Realtime Flash 1 is preview; HD V3 voices, azure_semantic_vad v2 and VASA-2 Photo Avatar are described in the voice announcement. Validate each model, locale, region and channel combination rather than inheriting core Voice Agents GA.")}
      ${note("<strong>Post-call is not the transaction boundary.</strong> Post-call delivery includes preview paths. Use it for supported downstream summaries/events with deduplication; business mutations must have been authorized and committed independently during execution.")}`, ["voiceconfig","phone","live","hosted","voice26"]);

    add("task-services", "Voice", "Use a task API when the job is extraction, not conversation.", "Speech, Language, Translator, Vision, Document Intelligence and Content Understanding are capability families with their own model, endpoint, data and pricing contracts.", `
      ${table(["Task","Candidate surface","Bottom-up implementation checks"],[
        ["Transcribe/translate/synthesize speech","Speech task APIs; custom speech/voice/avatar where supported.","Choose batch versus streaming, locales, audio format and model; test domain names, consent, attribution and custom-model lifecycle. Voice Agent access is not every Speech entitlement."],
        ["Classify, extract entities, redact or translate text","Language / PII and Translator task APIs.","Define schema/offset handling, language coverage, confidence thresholds and human-review rules. Redaction before an external call differs from detection afterward."],
        ["Read forms or structured documents","Document Intelligence or Content Understanding analyzers.","Version field/table schemas, classify/segment inputs, retain grounding/page coordinates and route low-confidence fields to review."],
        ["Understand mixed documents, images, audio and video","Content Understanding.","Choose analyzer and generative-model dependencies, asynchronous result handling, source grounding and modality-specific limits."],
        ["Describe/index images or semantic document chunks","Supported Vision / Document Intelligence / Content Understanding enrichment.","Measure extraction quality before RAG. Generated image descriptions are derived evidence, not the original source or automatic truth."]
