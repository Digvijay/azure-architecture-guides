      ${steps(["Define the machine-readable output contract and a representative labeled sample, including unreadable, unsupported and sensitive inputs.","Call the smallest supported API under its intended identity and network; inspect confidence, grounding, errors and asynchronous completion where applicable.","Persist only approved outputs with provenance and retention. Add an agent only if dialog, disambiguation or tool coordination adds value."])}
      ${note("<strong>Version and surface matter.</strong> Content Understanding's stable production contract differs from preview API features. Confirm supported region/model mappings and processing location. A feature absent from the new portal can still have a supported service API; portal readiness is not the whole product lifecycle.")}`, ["content","scope","iq26","voiceconfig"]);

    add("evaluation-design", "Assurance", "Build an executable specification of acceptable behavior.", "Evaluate the end-to-end agent trajectory, not just whether the final text sounds helpful.", `
      ${table(["Test slice","Assertions","Data and isolation"],[
        ["Retrieval","Allowed source, relevant evidence, correct citation, no-answer behavior, revoke/delete propagation.","Golden questions, missing/conflicting sources, two users with distinct access."],
        ["Tools and agent loop","Correct tool/arguments, authorized action, approval honored, step/time budget, idempotency.","Deterministic server assertions and an isolated business backend."],
        ["Voice","Recognition, first useful audio, interruption/cancellation, spoken privacy, successful transfer.","Recorded or controlled live test turns, pauses/noise/languages; text-only tests are insufficient."],
        ["Safety / abuse","Injection resistance, data boundaries, overbroad authority, consent failures and refusal.","Adversarial datasets and automated red teaming plus human review."],
        ["Operations","Latency percentiles, errors, token/compute/tool footprint and recovery.","Representative concurrency and dependency-failure injection."]
      ])}
      ${steps(["Version inputs, expected assertions, permitted resources, personas and evaluation configuration.", "Use built-in quality/RAG/agent/safety evaluators where supported; add deterministic and custom domain graders.", "Keep holdout and optimization datasets separate. Record judge model/version and adjudicate ambiguous/high-impact cases.", "Gate on hard authorization and safety constraints separately from weighted quality averages; inspect failures by slice before rollout."])}
      ${note("A zero-failure finite test run does not establish zero risk. Red teaming probes for failure; guardrails intervene at runtime; neither replaces service authorization or a release decision.")}`, ["observe","optimize","guards"]);

    add("continuous-loop", "Assurance", "Make improvement a controlled release loop.", "Establish, identify, optimize, validate and repeat. 'Learns from use' does not mean production weights, permissions or tools should change autonomously.", `
      ${steps([
        "<strong>Establish the bar.</strong> Version business-task slices, hard permission/safety assertions and calibrated evaluators. Expert annotations on approved traces can become evaluation cases; record consent, provenance and any generated rubric.",
        "<strong>Lock a baseline and holdout.</strong> A golden dataset is a governed quality bar, not a replacement for an unseen test set. Freeze target, evaluator/model version, tool fixtures and expected business outcomes.",
        "<strong>Identify the dominant failure.</strong> GA Insights groups recurring trace issues with evidence. Link an issue to exact agent/model/tool/knowledge versions and check whether it is genuinely a prompt/skill/model problem.",
        "<strong>Optimize in isolation.</strong> Compare candidate instructions, skills or models; preview skill/cost/insights integrations need eligibility checks. Restrict real tools because candidate evaluation may execute them before promotion.",
        "<strong>Validate the candidate.</strong> Compare holdout task success, multi-turn trajectory, user-permission isolation, safety, latency and cost per successful task. Inspect statistical uncertainty and harmed slices, not just the mean.",
        "<strong>Apply, canary and monitor.</strong> A human approves the compatible artifact set. Retain the prior version, feed sampled production evaluation/feedback into the next issue, and stop or roll back on hard-constraint violations."
      ])}
      ${cards([["Judge calibration","Microsoft-Decision-1.1 is one GA judge option, not objective truth. Measure agreement with qualified reviewers, label leakage and sensitivity to prompt/model changes."],["Cost is an outcome with scope","The preview Cost experience adds cross-agent/model/tool spend and forecasts. Reconcile billing meters; lower token cost can still increase total cost through retries, tools or longer hosted sessions."]])}
      ${note("<strong>Status reconciliation:</strong> Ignite announces core optimizer GA, while a portal readiness page still says limited preview. New insights-to-optimizer, skill optimization, cost optimization, trace annotations, golden datasets and safety rubrics are preview. Confirm the specific target/mode instead of inheriting a single product-wide label.")}`, ["improvement26","ignite","observe","optimize"], "Continuous improvement / GA core and preview modes");

    add("guardrail-matrix", "Assurance", "Locate the intervention point and enforcement owner.", "Model filtering, agent content controls, network egress, Azure Policy checks, and tool-server authorization do not enforce the same thing.", `
      ${table(["Control","Where it acts","Important limitation"],[
        ["Model guardrail","Supported inference inputs/outputs.","Not universal across model offers and managed-compute paths."],
        ["Agent guardrail","Assigned agent input/output; supported tool-call and response intervention points.","Agent content-safety and tool points include preview. Explicit agent policy overrides rather than simply adds to model policy."],
        ["Prompt Shields / task adherence / PII / protected material","Supported risks and feature-specific intervention points.","Check the current applicability matrix; risk coverage differs for agents, models and previews."],
        ["Network egress guardrail","Supported agent outbound calls.","Runtime restrictions and Azure Policy governance have different coverage and configuration requirements."],
        ["Business authorization","Application and downstream tool service.","A content classifier cannot authorize a refund, enforce record ownership or guarantee idempotency."]
      ])}
      ${note("<strong>Lifecycle warning:</strong> the documented Azure OpenAI groundedness detection preview retires 30 April 2027. Do not confuse that runtime detector with groundedness evaluation metrics. Record migration work for affected filters instead of assuming every similarly named capability retires.")}
      <p class="fine">Test the effective assigned policy with known allow/block examples at each supported intervention point, including tool responses. Log policy identifiers and nonsecret outcomes without capturing unnecessary sensitive content.</p>`, ["guards","compute","governance"]);

    add("runtime-controls", "Assurance", "A runtime policy needs an unskippable enforcement point.", "Agent Controls public preview uses the Agent Control Specification and Agent Hooks to evaluate proposed actions/content. A policy receipt is evidence of a decision, not proof the business action obeyed it.", `
      ${flow([["Hook","Pause before an action"],["Evaluate","Evidence + versioned policy"],["Verdict","Allow / deny / transform + receipt"],["Enforce","Runtime applies decision"],["Tool","Own auth + validation + idempotency"]])}
      ${steps([
        "<strong>Separate control types.</strong> Model content classification, deterministic business limits, contextual LLM judgments, network egress and Azure Policy configuration checks act at different points.",
        "<strong>Choose and bind the policy.</strong> Record scope, policy version, action schema, annotators and allowed transformations. Deterministic limits should not rely solely on a probabilistic judge.",
        "<strong>Verify runtime integration.</strong> Supported Foundry runtimes integrate enforcement; external hosts must enforce the returned verdict themselves through the appropriate hook contract. Ensure every relevant execution path reaches the hook.",
        "<strong>Test failure behavior.</strong> Deny a prohibited action, reject malformed verdicts, expire stale decisions and prevent transformed arguments from bypassing validation. Specify timeout/unavailable behavior for each risk rather than assuming a universal default.",
        "<strong>Retain an audit chain.</strong> Correlate initiator, agent identity, proposal, policy receipt, exact executed arguments and downstream result without leaking sensitive content. Keep server authorization and human approval where required."
      ])}
      ${table(["Related surface","Status at review","Do not confuse it with"],[
        ["Custom policies in Foundry guardrails","Private preview; deterministic rules and contextual judges.","Universal availability of custom runtime rules."],
        ["Foundry Compliance policy management","Public preview; Azure Policy audit/deny where supported.","Stopping all existing agent runs when a configuration is noncompliant."],
        ["ACS integration in Foundry Compliance","Private preview; stricter verdict wins where both configured scopes apply.","The separate agent-versus-model guardrail override contract."],
        ["Agent 365 tenant-wide Foundry policies","Preannouncement in event examples.","An available tenant-wide enforcement feature today."]
      ])}
      ${note("<strong>Do not generalize precedence.</strong> ACS scope-combination semantics and agent content-guardrail override semantics are different contracts. Prove the effective policy at the actual intervention point. No policy layer removes the downstream service's authorization responsibility.")}`, ["controls26","governance26","guards"], "Agent Controls public preview / related private previews");

    add("traces-debug", "Operations", "Debug the failing hop, not the last symptom.", "Tracing, monitoring, evaluation, and feedback answer different questions; configure their data sources and access separately.", `
      ${table(["Symptom","Inspect first","Evidence"],[
        ["401 / 403 from tool","Agent-to-Toolbox boundary, then connection audience and downstream actor/grants/consent.","Sanitized status and endpoint, identity object ID, target scope, correlation ID; never copy tokens."],
        ["No tools / startup not ready","Default/pinned Toolbox version, tools/list, remote source health and allowed-tool names.","Separate discovery failure from selection and invocation."],
        ["Wrong user's data despite HTTP 200","Caller-context forwarding, delegated mode, source authorization and concurrent-user tests.","Compare users/tenants and result access, not only request success."],
        ["Slow voice turn","End-of-speech detection, transport, planner, retrieval/tool latency, model and playback.","Trace-linked timing plus user-perceived audio metrics."],
        ["429","Rate quota, gateway policy, or Foundry cost-control error.","Cost-control blocks include x-ms-budget-cause: budget_exceeded; streaming errors need event handling."]
      ])}
      ${cards([["Instrument and correlate","Use supported OpenTelemetry/Application Insights integration for agent, model, retrieval and tool spans. Record deployment/version, outcome and latency; restrict sensitive prompts, tool payloads and recordings."],["Improve from evidence","Use supported trace replay, human feedback, trace-to-dataset and continuous evaluation. Replay may re-execute tools: use test resources. Missing traces or quality metrics mean telemetry/evaluation gaps, not zero incidents."]])}`, ["observe","hostedtools","costs","scope"]);

    add("budgets-gateway", "Operations", "A spending alert is not a kill switch.", "Map every cost meter and explicitly choose where requests can be rejected.", `
      ${table(["Mechanism","What it controls","What it does not guarantee"],[
        ["Azure Cost Management budget","Delayed billed-cost tracking and alerts/automation.","Does not itself stop inference or tool execution."],
        ["Foundry cost controls (preview)","Configured token/spending budgets and alert/block actions for supported usage.","Current exclusions include PTU, tool charges and hosted compute; provider/model/router coverage is limited."],
        ["Quota / rate limits","TPM/RPM, deployment capacities and service-specific limits.","A cost ceiling, deployment capacity reservation or uniform cross-model throughput."],
        ["AI Gateway / APIM","Supported traffic routed through the gateway: rate/token limits, routing, auth and observability.","Traffic that bypasses it or downstream tool business authorization."],
        ["Application budgets","Per-task steps, tokens, wall time, concurrency and tool-call limits.","Exact invoice reconciliation without tracking every dependent meter."]
      ])}
      ${note("<strong>Cost-control failure semantics:</strong> a threshold-crossing request can complete; updates can take up to 15 minutes; documentation says a request can run if the check cannot complete in time. Project-level chat-completions blocking also has exceptions. Treat preview controls as bounded coverage, not an absolute financial guarantee.")}
      ${note("<strong>Azure AI Gateway changed at Ignite 2026.</strong> The former APIM AI Gateway tier is now a standalone GA service; existing API Management AI policies remain a distinct choice. Configure approved model aliases/MCP tools, caller access, explicit routing and enforced limits, then prove a denied call and an unapproved direct-backend path. Private Link, private-backend VNet integration and selected Foundry model connections remain preview. Gateway limits cover routed traffic, not every Foundry or Azure charge.")}
      <p class="fine">Budget for input/output/reasoning/audio tokens as applicable, provisioned/accelerator capacity, hosted sessions, Search, embeddings, tools, carrier services, storage, networking, evaluations and telemetry. Optimize cost per successful authorized business task.</p>`, ["costs","governance","deployment","compute","gateway26"]);

    add("reliability", "Operations", "Recover state and authority, not just an endpoint.", "Separate transient retries, application degradation, version rollback, and regional disaster recovery.", `
      ${steps([
        "<strong>Classify failures.</strong> Retry bounded transient failures with jitter and server guidance. Do not blindly retry invalid arguments, denied consent, forbidden actions, or budget blocks.",
        "<strong>Contain side effects.</strong> Use operation IDs and idempotent downstream mutations. Timeouts after commit need status lookup/reconciliation, not another unconditional write.",
        "<strong>Define safe degradation.</strong> An unavailable knowledge source should produce an explicit limitation, not an invented answer. If approval/identity is unavailable, do not downgrade to a shared powerful credential.",
        "<strong>Prepare recovery dependencies.</strong> Model/version and processing scope, quota/capacity, knowledge freshness, conversation/business state, tool connectivity, secrets, identity grants and telemetry must work in the target.",
        "<strong>Exercise rollback and failover.</strong> Test agent version, Toolbox version, model deployment, retrieval schema and client compatibility. Measure RTO/RPO for each state store and document user-visible recovery behavior."
      ])}
      ${note("Foundry resource location and Global model routing do not automatically replicate project state or fail over the entire application. A separately provisioned region is a recovery candidate only after compliant capacity, data, identity and routing are proven. In voice, reconnecting a media session is not equivalent to resuming a business transaction.")}`, ["architecture","deployment","hosted","network"]);

    add("ship", "Enterprise", "Release a compatibility manifest.", "Infrastructure, agents, models, connections, knowledge schemas, Toolbox versions, and clients need one reproducible release record.", `

      ${steps(["Record nonsecret artifact IDs, versions, region/processing scope, identities, feature status and evidence links.", "Gate production on signed-off preview dependencies, ownership, incident plan and rollback compatibility.", "Choose channels deliberately: application endpoint, Microsoft Copilot/Teams publishing, external runtime registration or supported telephony. Publishing changes reach and identity expectations.", "Test a user through the final channel, not only a playground administrator; confirm telemetry correlation and user authorization end to end."])}
      ${note("Azure Developer CLI, SDKs, Foundry Toolkit/VS Code, Agent Canvas, templates and coding-agent/MCP integrations are authoring surfaces. Their presence does not alter production permissions or make generated code deployment-ready.")}`, ["scope","agents","hostedtools","voiceconfig","ga"]);

    add("fleet-governance", "Enterprise", "Govern configuration and runtime separately.", "Foundry governance (formerly Control Plane) combines native identity, access, cost and safety controls with optional specialized integrations.", `

    add("capstone", "Reference", "Assemble the service desk. Then break it deliberately.", "Use this implementation sequence as a practical lab with your own approved nonproduction subscription and test data. This page itself never provisions resources.", `
      ${steps([
        "<strong>Foundation gate:</strong> create an approved Foundry account/project and one model; record endpoints/ARM IDs, principals and network decisions. Prove builder/consumer separation.",
        "<strong>Knowledge gate:</strong> ingest a public-to-staff policy and a restricted policy into a supported knowledge source. Prove two users get different permitted evidence; revoke one document and measure propagation.",
        "<strong>Tool gate:</strong> expose read-order and propose-change through a narrow test MCP API. Configure connection identity, test a versioned Toolbox, and implement server-side authorization/idempotency and exact-action approval.",
        "<strong>Runtime gate:</strong> bind one prompt or hosted agent. Trace model -> retrieval -> tools; verify caller-context preservation, bounded loops, timeouts and consent handling.",
        "<strong>Voice gate:</strong> create a separate Voice Agent with one supported model, short instructions and the tested knowledge/tool path. Pin its Toolbox version. Test barge-in, long pauses, no evidence, tool timeout-after-commit and a disconnected caller.",
        "<strong>Release gate:</strong> run your holdout and adversarial suites; include forbidden-user, replayed approval, unavailable private dependency, stale ACL, wrong-audience token and budget-block cases. Keep mutations in isolated test resources.",
        "<strong>Operations gate:</strong> show a trace, a failing assertion, an approved rollback and a reconciled backend result. Test the final client/channel under a restricted consumer before expanding."
      ])}
      ${note("<strong>Deliverables:</strong> dependency/data-flow diagram; principal-to-target matrix; version manifest; sanitized positive/negative evidence; dataset and evaluator lineage; preview exception register; cost model; RTO/RPO and rollback runbook. A working greeting is not the acceptance test.")}`, ["projects","pipeline","hostedtools","voice","observe"]);

    ];
    drills.forEach(([title],index)=>{const option=document.createElement("option");option.value=String(index);option.textContent=title;$("drill").append(option);});
    function drillLab(){const [title,context,answers,best,reason]=drills[Number($("drill").value)];output("drill-context",title,context);output("drill-result","Choose the corrective action.","Inspect the identity, contract or execution boundary rather than masking the symptom.");$("drill-options").replaceChildren();answers.forEach((text,index)=>{const button=document.createElement("button");button.className="answer";button.textContent=`${String.fromCharCode(65+index)}. ${text}`;button.setAttribute("aria-pressed","false");button.addEventListener("click",()=>{$("drill-options").querySelectorAll("button").forEach(other=>other.setAttribute("aria-pressed",String(other===button)));output("drill-result",index===best?"Correct boundary to repair.":"That does not repair the failing boundary.",index===best?reason:`Reconsider which principal, protocol or runtime owns the failure. ${reason}`);});$("drill-options").append(button);});}
    $("drill").addEventListener("change",drillLab);
    const atlasEntries=[];
    atlasGroups.forEach(([area,items])=>{const option=document.createElement("option");option.value=area;option.textContent=area;$("atlas-area").append(option);items.forEach(([name,path,consideration])=>{const card=document.createElement("article");card.className="card";const url=path.startsWith("https:")?path:base+path;card.innerHTML=`<span class="badge">${esc(area)}</span><h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)} &nearr;</a></h3><p>${esc(consideration)}</p>`;$("atlas-results").append(card);atlasEntries.push({area,name,consideration,url,card});});});
    function filterAtlas(){const query=$("atlas-query").value.trim().toLocaleLowerCase(),area=$("atlas-area").value;let count=0;atlasEntries.forEach(entry=>{const match=(!area||entry.area===area)&&`${entry.name} ${entry.consideration} ${entry.area}`.toLocaleLowerCase().includes(query);entry.card.hidden=!match;if(match)count++;});$("atlas-count").textContent=`${count} / ${atlasEntries.length} capability / announcement entries`;$("atlas-empty").hidden=count!==0;}
    $("atlas-query").addEventListener("input",filterAtlas);$("atlas-area").addEventListener("change",filterAtlas);
    const evidence=[
      "Project/resource boundary: ARM IDs, tenant, subscription, region, environments, endpoints and dependency owners.",
      "Network paths: actual-client ingress, runtime egress, Search/source/model paths, registry and telemetry verified.",
      "Principal matrix: deployment, builder, consumer, project identity, agent identity, Search identity and downstream actor.",
      "Delegation: supported scheme, correct audience, consent, caller-context propagation and concurrent-user isolation.",
      "Model contract: provider/version, serving route, processing scope, capacity/quota, load evidence and retirement policy.",
      "Knowledge: schema/source/KB versions, ingestion, citations, ACLs, freshness, revoke/delete and planner verification.",
      "Toolbox/MCP: connection modes, schemas/allowlists, immutable/default bindings, discovery and exact-action approvals.",
      "Runtime/state: protocol, user/tenant ownership, memory scope/retention, loop limits, retry and idempotency.",
      "Voice: architecture, model management, audio/protocol, turn-taking, tools, privacy, channel and handoff evidence.",
      "Assurance: versioned datasets/evaluators, deterministic safety gates, holdouts, red teaming and human review.",
      "Operations: trace/feedback lineage, per-task cost, budget exclusions, alerts, dependencies, RTO/RPO and rollback.",
      "Governance/release: compatibility manifest, supported policy enforcement, preview exceptions, owner and review date."
    ];
    evidence.forEach(text=>{const label=document.createElement("label");label.className="check";const input=document.createElement("input");input.type="checkbox";const span=document.createElement("span");span.textContent=text;label.append(input,span);$("checklist").append(label);input.addEventListener("change",updatePlan);});
    function updatePlan(){$("plan-count").textContent=`${$("checklist").querySelectorAll("input:checked").length} / ${evidence.length}`;}
    function planText(){const checked=[...$("checklist").querySelectorAll("input")];return ["MICROSOFT FOUNDRY - IMPLEMENTATION EVIDENCE PLAN",`Created: ${new Date().toISOString()}`,"Documentation review: 2026-11-23","Planning aid only. No Azure resource or production readiness has been validated by this file.","",...evidence.map((text,index)=>`${checked[index].checked?"[x]":"[ ]"} ${text}`),"","COMPLETE IN YOUR AUTHORIZED SYSTEM","Accountable owner: [agree]","Nonproduction target: [agree]","Evidence location and gaps: [record]","Preview/announcement exceptions: [review]","Review date: [agree]","Rollout boundary and rollback trigger: [agree]","","OFFICIAL REFERENCES",...Object.values(refs).map(([title,url])=>`${title}: ${url}`),"","Verify current API, region, model, network, identity, licensing and feature status before implementation."].join("\r\n");}
    $("download").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([planText()],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="microsoft-foundry-implementation-evidence-plan.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("Plan download requested. If blocked, use View / copy.");});
    $("view-plan").addEventListener("click",()=>{$("plan-text").value=planText();$("plan-dialog").showModal();});
    $("copy").addEventListener("click",async()=>{try{if(!navigator.clipboard)throw new Error("Clipboard API unavailable.");await navigator.clipboard.writeText($("plan-text").value);notify("Evidence plan copied.");}catch(error){console.warn("Clipboard copy unavailable:",error);$("plan-text").focus();$("plan-text").select();notify("Automatic copy unavailable. The text is selected; use your device's copy command.");}});
    Object.values(refs).forEach(([title,url])=>{const card=document.createElement("article");card.className="card";card.innerHTML=`<h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)} &nearr;</a></h3><p class="fine">${esc(url)}</p>`;$("source-list").append(card);});
    themeState();authLab();retrievalLab();approvalLab();voiceLab();latencyLab();drillLab();filterAtlas();updatePlan();show(false);
  </script>
</body>
</html>
